<!DOCTYPE html>
<html lang="zh-CN" >
<head data-page-node-id="CN0PFpDUi3VPwyFYzVptZN">
<meta charset="UTF-8" data-page-node-id="z6QvpEC3rksrD74TfRp0Hz">
<meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="Oe6qfv09uklNiKjChewLHi">
<title>RabbitPlaneChess</title>
<meta name="application-name" content="RabbitPlaneChess">
<meta name="description" content="RabbitPlaneChess — 与朋友或电脑一起起飞的飞行棋游戏。">
<meta name="theme-color" content="#f5f5f2">
<meta name="apple-mobile-web-app-title" content="RabbitPlaneChess">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" href="./styles/app.css">
</head><body>
<header id="header"><a class="brand" href="/" id="brandHome"><img src="./icons/icon.svg" alt="">RabbitPlaneChess</a><span id="themeTag" class="tag">一起玩一局</span><button id="homeButton" hidden>← 主题首页</button></header>
<main id="home" hidden><div class="eyebrow">PICK YOUR PLAYGROUND</div><h1>同一场较量，两种好心情。</h1><p>选一个喜欢的世界，再邀请朋友或电脑入座。</p><div id="themeCards" class="cards"></div><footer><span>2–4 方 · 本地同玩 · 两档电脑难度</span><span>相同玩法，自在选择。</span></footer><p id="routeMessage" role="status"></p></main>
<main id="setup" hidden><div class="setup-title"><div><span id="setupTheme" class="eyebrow"></span><h1>谁来一起玩？</h1></div><span class="tag">01 选主题 / 02 设座位</span></div><p>每种颜色独立设置，至少开启两方。</p><div class="setup-box"><div id="seats"></div><div class="setup-options"><span id="setupCount" role="status"></span><button id="testButton"></button></div><button id="startButton" class="primary wide">开始游戏 →</button><p class="rules" id="rulesText"></p></div></main>
<main id="game" hidden><div id="sceneHost"></div><aside id="playerPanel"><div class="eyebrow">本场玩家</div><div id="players"></div></aside><aside id="controls"><section class="panel"><span class="eyebrow" id="turnType"></span><h2 id="turnText"></h2><div id="diceFace" aria-label="尚未掷骰">—</div><button id="rollButton" class="primary wide" aria-keyshortcuts="Enter">掷骰子 <span class="key-hint">Enter ↵</span></button><p id="hint" role="status" aria-live="polite"></p><div id="pickPanel" aria-label="选择独立棋子"></div></section><section id="tips" class="panel"><div class="eyebrow">小小提示</div><p id="tipText"></p></section><div id="viewControls"><button data-view="tilt" class="on">3D</button><button data-view="top">俯视</button><button data-view="follow">跟随：关</button></div><div class="game-actions"><button id="backSetup">返回设置</button><button id="restartButton">重开一局</button></div></aside></main>
<div id="loading" hidden role="status"><div class="panel"><h2>正在准备棋盘…</h2><p>RabbitPlaneChess</p><button id="cancelLoad">返回设置</button></div></div>
<dialog id="result"><div class="eyebrow">本场名次</div><h1 id="winner"></h1><div id="ranking"></div><button id="againButton" class="primary wide">再来一局</button><button id="resultSetup" class="wide">返回设置</button><button id="resultHome" class="wide">主题首页</button></dialog>
<script type="module" src="./js/app.js"></script>
</body></html>
